name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ───────────────────────── 后端 ─────────────────────────
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: novel-build-test/backend

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: aisqa
          MYSQL_USER: aisqa
          MYSQL_PASSWORD: aisqa123
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost -u root -proot"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: novel-build-test/backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install -r requirements.txt
          pip install httpx pytest pytest-asyncio

      - name: Run tests（带 DB）
        run: |
          source .venv/bin/activate
          # 等待 MySQL 就绪
          for i in $(seq 1 30); do
            if mysqladmin ping -h 127.0.0.1 -u root -proot --silent 2>/dev/null; then
              echo "MySQL ready"
              break
            fi
            echo "Waiting for MySQL... $i"
            sleep 2
          done
          pytest tests/ -v --tb=short
        env:
          AISQA_DATABASE_URL: mysql+aiomysql://aisqa:aisqa123@127.0.0.1:3306/aisqa
          AISQA_REDIS_URL: redis://127.0.0.1:6379/0
          AISQA_SECRET_KEY: ci-test-secret-key-change-in-production
          AISQA_DEBUG: "true"

  # ───────────────────────── 前端 ─────────────────────────
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: novel-build-test/frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: novel-build-test/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint src/ --max-warnings 50 2>/dev/null || echo "Lint warnings exist (non-blocking)"

      - name: Unit tests
        run: npx vitest run

      - name: Build
        run: npm run build

      # ─── Playwright E2E（仅 PR，需要 MySQL/Redis） ───
      - name: Install Playwright browsers
        run: npx playwright install chromium

      - name: Run Playwright E2E tests
        run: npx playwright test --reporter=list
        continue-on-error: true  # E2E 结果仅供参考，不阻塞 CI

  # ───────────────────────── 综合状态 ─────────────────────────
  result:
    if: always()
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Check backend result
        run: |
          echo "Backend: ${{ needs.backend.result }}"
          echo "Frontend: ${{ needs.frontend.result }}"
          if [ "${{ needs.backend.result }}" != "success" ]; then
            echo "❌ Backend tests failed"
            exit 1
          fi
          if [ "${{ needs.frontend.result }}" != "success" ]; then
            echo "❌ Frontend tests failed"
            exit 1
          fi
          echo "✅ All checks passed"
