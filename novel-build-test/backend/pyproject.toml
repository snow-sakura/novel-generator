[project]
name = "aisqa-backend"
version = "1.2.0"
description = "AISQA — AI-driven Software Quality Assurance Platform"
requires-python = ">=3.12"

[tool.ruff]
target-version = "py312"
line-length = 120
indent-width = 4
exclude = [
    ".venv",
    ".git",
    "__pycache__",
    "alembic/versions",
    "alembic/env.py",
]

lint.select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "PL",  # pylint
    "RUF", # ruff-specific
    "B",   # bugbear
    "SIM", # simplify
    "LOG", # logging
    "C4",  # comparisons
]

lint.ignore = [
    "E501",    # line length (handled by ruff format)
    "PLR0913", # too many args
    "PLR0904", # too many methods
    "PLR0911", # too many returns
    "PLR0912", # too complex
    "PLR0915", # too many statements
    "N802",    # allow uppercase function names (FastAPI routes)
    "N803",    # allow uppercase argument names
    "N806",    # allow uppercase variable names
    "B904",    # raise ... from optional
    "SIM117",  # merge with statements optional
    "C408",    # dict() over {} optional
    "RUF001",  # ambiguous-unicode in Chinese strings (intentional)
    "RUF002",  # ambiguous-unicode in Chinese docstrings (intentional)
    "RUF003",  # ambiguous-unicode in Chinese comments (intentional)
    "PLC2401", # non-ascii names (Chinese variable names intentional)
    "PLC2403", # non-ascii import names (Chinese module names intentional)
    "N801",    # invalid class name (Chinese names intentional)
    "PLC0415", # import-outside-top-level (lazy imports intentional)
    "F541",    # f-string-missing-placeholders (Chinese text false positives)
    "B008",    # function-call-in-default-argument (FastAPI Depends() standard)
    "E402",    # module-import-not-at-top-of-file (lazy imports intentional)
    "PLR2004", # magic-value-comparison (low priority)
    "PLW0603", # global-statement (config patterns intentional)
    "E712",    # true-false-comparison (style preference)
    "SIM105",  # suppressible-exception (acceptable)
    "UP042",   # replace-str-enum (acceptable)
    "PLC0206", # dict-index-missing-items (acceptable)
    "PLR1730", # if-stmt-min-max (acceptable)
    "SIM108",  # if-else-block-instead-of-if-exp (readability preference)
    "UP035",   # deprecated-import (compat aliases)
    "RUF006",  # asyncio-dangling-task (intentional fire-and-forget)
]

lint.fixable = ["I", "UP", "RUF", "SIM"]

lint.isort.known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
