name: ✨ 功能建议
description: 为创作流程、智能体或 Demo 提出新功能
labels: ["enhancement"]
body:
  - type: dropdown
    id: area
    attributes:
      label: 相关模块
      options: [生成管线/Page/Agent, V3 功能(F#), V1, 在线 Demo, 文档, 其他]
  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题 / 场景
      placeholder: 作为网文作者，我希望 …，因为 …
    validations: { required: true }
  - type: textarea
    id: solution
    attributes:
      label: 建议方案
  - type: textarea
    id: alternative
    attributes:
      label: 替代方案
