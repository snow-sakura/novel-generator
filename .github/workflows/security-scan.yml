name: Security Scan (gitleaks + deps)

on:
  push:
  pull_request:
  schedule:
    - cron: '0 3 * * 1'   # 每周一复查全量历史

permissions:
  contents: read

jobs:
  gitleaks-history:
    name: 全量历史密钥扫描
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar xz
          sudo install gitleaks /usr/local/bin/

      - name: Run gitleaks
        run: gitleaks detect --source . --config .gitleaks.toml --redact --exit-code 1

  working-tree-check:
    name: 工作区快速检查（.env/*.db/硬编码 Key）
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Forbidden files & patterns
        run: |
          set -e
          if git ls-files | grep -E '(^|/)\.env$|\.env\.(local|prod|dev)$|\.db$|(^|/)backups/'; then
            echo "::error::发现禁止入库的敏感文件（.env / *.db / backups/）"; exit 1
          fi
          if git grep -I -nE "sk-[A-Za-z0-9]{24,}" -- . | grep -vE "sk-(xxx|xxx…|\*+|•+)" ; then
            echo "::error::发现疑似真实 API Key"; exit 1
          fi
          echo "✅ 工作区检查通过"

  dependency-audit:
    name: 依赖漏洞扫描（pip-audit + npm audit）
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Audit frontends（阻断：首轮观察期官方源无 high 级漏洞，2026-10-18 收紧）
        run: |
          for fe in novel-build-system/v3/frontend novel-build-system/v1/frontend; do
            echo "::group::$fe"
            (cd "$fe" && npm audit --omit=dev --audit-level=high)
            echo "::endgroup::"
          done

      - name: pip-audit V3 backend（阻断）
        run: |
          pip install -q pip-audit
          pip-audit -r novel-build-system/v3/backend/requirements.txt --skip-editable

      - name: pip-audit V1 backend（阻断；已知项显式豁免留痕，见 docs/SECURITY.md）
        run: |
          pip install -q pip-audit
          # crewai 1.15.x 硬 pin chromadb~=1.5.9 / mcp~=1.28.1，升级需等 crewai 新版，风险可接受（本地单机工具）
          pip-audit -r novel-build-system/v1/backend/requirements.txt --skip-editable \
            --ignore-vuln PYSEC-2026-311 \
            --ignore-vuln PYSEC-2026-3813 \
            --ignore-vuln PYSEC-2026-3814 \
            --ignore-vuln PYSEC-2026-3815 \
            --ignore-vuln CVE-2026-59951

