name: E2E (V3 Frontend)

on:
  push:
    branches: [main]
    paths:
      - 'novel-build-system/v3/frontend/**'
      - '.github/workflows/e2e.yml'
  pull_request:
    paths:
      - 'novel-build-system/v3/frontend/**'
  workflow_dispatch:

jobs:
  e2e:
    name: Playwright E2E（离线 Mock）
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: novel-build-system/v3/frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: novel-build-system/v3/frontend/package-lock.json

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - name: Build frontend
        run: npm run build

      - name: Bundle size budget（gzip 基线 151KB，上限 190KB）
        run: node ../../../scripts/ci/bundle-budget.mjs dist 190

      - name: Run E2E (mock server, no backend needed)
        run: npx playwright test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            novel-build-system/v3/frontend/test-results/
            novel-build-system/v3/frontend/playwright-report/
          retention-days: 7
